name: Build Simplified Chinese IPA and TrollStore TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-zh-hans.yml'
      - 'tools/release/**'
      - 'browser/Reynard/Entitlements/**'
      - 'browser/Helper/Entitlements/**'
      - 'browser/Reynard/JIT/Unsandboxed/**'
      - 'browser/Reynard/Resources/Localizable.xcstrings'
      - 'browser/Reynard/Client/Interface/**/AddonLocalizable.xcstrings'
      - 'browser/Reynard/Client/Interface/**/SettingsLocalizable.xcstrings'
      - 'browser/Reynard/Client/Interface/**/WebContentErrorLocalizable.xcstrings'

permissions:
  contents: read

concurrency:
  group: build-zh-hans-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Chinese IPA and TrollStore TIPA (arm64)
    runs-on: macos-26
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: zh-hans
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm ldid
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize source submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Fetch matching Gecko release
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Gecko and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            support/idevice/target
          key: zh-hans-${{ runner.os }}-${{ hashFiles('engine/release.txt', 'support/idevice/Cargo.lock') }}
          restore-keys: |
            zh-hans-${{ runner.os }}-

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko engine
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh --use-sccache --auto-clobber

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Archive iOS app
        run: ./tools/release/build-app.sh --no-signing

      - name: Package IPA
        run: ./tools/release/create-ipa.sh

      - name: Package TrollStore TIPA with private entitlements and JIT helper
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Verify Chinese resources and TrollStore package
        run: |
          python3 - <<'PY'
          import plistlib
          import subprocess
          import zipfile
          from pathlib import Path

          prefix = 'Payload/Reynard.app/'
          for package in ('Reynard.ipa', 'Reynard-TrollStore.tipa'):
              with zipfile.ZipFile(Path('dist') / package) as archive:
                  assert archive.testzip() is None, f'Corrupt package: {package}'
                  names = set(archive.namelist())
                  for resource in ('Reynard', 'PlugIns/Reynard Helper.appex/Reynard Helper',
                                   'PlugIns/OpenIn.appex/OpenIn', 'zh-Hans.lproj/Localizable.strings'):
                      assert prefix + resource in names, f'Missing {resource} in {package}'
                  if package.endswith('.tipa'):
                      assert prefix + 'ts_ptrace_jit' in names, 'Missing TrollStore JIT helper'

          app = Path('dist/Reynard/Payload/Reynard.app')
          for executable, entitlements in (
              ('Reynard', 'browser/Reynard/Entitlements/Reynard.private.entitlements'),
              ('PlugIns/Reynard Helper.appex/Reynard Helper', 'browser/Helper/Entitlements/Reynard-Helper.private.entitlements'),
              ('ts_ptrace_jit', 'browser/Reynard/JIT/Unsandboxed/ptrace_jit.entitlements'),
          ):
              actual = plistlib.loads(subprocess.check_output(['ldid', '-e', str(app / executable)]))
              expected = plistlib.loads(Path(entitlements).read_bytes())
              assert actual == expected, f'Incorrect entitlements: {executable}'
          print('Verified IPA/TIPA integrity, Simplified Chinese resources, extensions and TrollStore entitlements.')
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-zh-Hans-${{ github.sha }}
          path: dist/Reynard.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload TrollStore TIPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-zh-Hans-TrollStore-${{ github.sha }}
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error
          retention-days: 14
