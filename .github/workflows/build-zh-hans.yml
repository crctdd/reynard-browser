name: Build Simplified Chinese IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-zh-hans.yml'
      - 'browser/Reynard/Resources/Localizable.xcstrings'
      - 'browser/Reynard/Client/Interface/**/AddonLocalizable.xcstrings'
      - 'browser/Reynard/Client/Interface/**/SettingsLocalizable.xcstrings'
      - 'browser/Reynard/Client/Interface/**/WebContentErrorLocalizable.xcstrings'

permissions:
  contents: read

concurrency:
  group: build-zh-hans-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA (arm64)
    runs-on: macos-26
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: zh-hans
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen llvm ldid
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Initialize source submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Fetch matching Gecko release
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Gecko and Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            support/idevice/target
          key: zh-hans-${{ runner.os }}-${{ hashFiles('engine/release.txt', 'support/idevice/Cargo.lock') }}
          restore-keys: |
            zh-hans-${{ runner.os }}-

      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko engine
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
        run: ./tools/development/build-gecko.sh --use-sccache --auto-clobber

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Archive iOS app
        run: ./tools/release/build-app.sh --no-signing

      - name: Package IPA
        run: ./tools/release/create-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-zh-Hans-${{ github.sha }}
          path: dist/Reynard.ipa
          if-no-files-found: error
          retention-days: 14
